    <g filter="url(#charcoal)">
      <path d="M 240 600 C 245 540 235 500 215 460 C 190 410 185 340 205 280 C 230 200 300 170 360 185 C 400 195 420 225 425 260 C 428 285 425 300 432 315 C 440 330 452 345 455 360 C 458 372 450 378 440 380 C 445 392 446 400 440 408 C 446 415 444 425 436 430 C 440 445 438 460 425 470 C 410 478 395 478 385 480 C 375 510 372 560 380 600 L 470 640 C 520 660 540 720 540 800 L 120 800 C 120 720 150 660 240 600 Z" fill="url(#hatch)"/>
      
